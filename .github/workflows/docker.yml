name: build docker image

on:
  push:
  # branches: main
    tags:
      - '*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: vars
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG_VERSION#v}
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 1
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: akeb/calibre-telegram-bot:${{ env.TAG_VERSION }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=calibre-telegram-bot-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=calibre-telegram-bot-${{ matrix.suffix }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG_VERSION#v}
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Publish multi-arch release manifest
        run: |
          docker buildx imagetools create \
            -t akeb/calibre-telegram-bot:latest \
            -t akeb/calibre-telegram-bot:${{ env.TAG_VERSION }} \
            akeb/calibre-telegram-bot:${{ env.TAG_VERSION }}-amd64 \
            akeb/calibre-telegram-bot:${{ env.TAG_VERSION }}-arm64
